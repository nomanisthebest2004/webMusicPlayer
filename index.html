<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TS Audio Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id = "img-div">
        <img src="" alt="Disc Image" id = "disc" class="drop-zone">
    </div>
    <div class="player-card">
        <h2 id="track-title">No Track Loaded</h2>
        <p id="track-status">Stopped</p>

        <audio id="audio-element"></audio>

        <div class="controls">
            <button id="play-btn">Play</button>
            <button id="pause-btn">Pause</button>
            <button id="stop-btn">Stop</button>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
            <span id="volume-lvl"></span>
        </div>
    </div>
    <script src="dist/main.js"></script>
</body>
</html>
