<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TS Audio Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id = "img-div">
        <img src="vinyl.jpg" alt="Disc Image" id = "disc">
    </div>
    <div class="player-card">
        <h2 id="track-title">No Track Loaded</h2>
        <p id="track-status">Stopped</p>

        <audio id="audio-element"></audio>

        <div class="controls">
            <button id="play-btn">Play</button>
            <button id="pause-btn">Pause</button>
            <button id="stop-btn">Stop</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
